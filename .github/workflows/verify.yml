name: verify

# The README and JUDGING_GUIDE ask reviewers to run `npm test` and `npm run
# build`. This workflow makes those two claims continuously true instead of
# asking anyone to take them on trust.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Campaign dry run (fake Nansen, zero real calls)
        run: npm run dry:campaign

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
